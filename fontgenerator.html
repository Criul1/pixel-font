<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1-Bit Pixel Font Generator</title>
    <style>
      /* Embedded critical CSS - works offline */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #1a1a1a;
        color: #e0e0e0;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-grow { flex-grow: 1; }
      .flex-shrink-0 { flex-shrink: 0; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      .justify-between { justify-content: space-between; }
      .gap-2 { gap: 0.5rem; }
      .gap-6 { gap: 1.5rem; }
      .w-full { width: 100%; }
      .w-12 { width: 3rem; }
      .w-20 { width: 5rem; }
      .w-64 { width: 16rem; }
      .h-12 { height: 3rem; }
      .h-screen { height: 100vh; }
      .h-2 { height: 0.5rem; }
      .p-0 { padding: 0; }
      .p-1 { padding: 0.25rem; }
      .p-3 { padding: 0.75rem; }
      .p-8 { padding: 2rem; }
      .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
      .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
      .mb-6 { margin-bottom: 1.5rem; }
      .mt-8 { margin-top: 2rem; }
      .text-center { text-align: center; }
      .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
      .text-2xl { font-size: 1.5rem; line-height: 2rem; }
      .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
      .text-base { font-size: 1rem; line-height: 1.5rem; }
      .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
      .font-bold { font-weight: 700; }
      .font-semibold { font-weight: 600; }
      .bg-\[#1a1a1a\] { background-color: #1a1a1a; }
      .bg-\[#242424\] { background-color: #242424; }
      .bg-gray-700 { background-color: #374151; }
      .bg-gray-800 { background-color: #1f2937; }
      .bg-green-600 { background-color: #16a34a; }
      .bg-green-700 { background-color: #15803d; }
      .bg-white { background-color: #ffffff; }
      .text-white { color: #ffffff; }
      .text-gray-300 { color: #d1d5db; }
      .text-gray-400 { color: #9ca3af; }
      .text-gray-500 { color: #6b7280; }
      .rounded-md { border-radius: 0.375rem; }
      .rounded-full { border-radius: 9999px; }
      .rounded-lg { border-radius: 0.5rem; }
      .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
      .shadow-inner { box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06); }
      .z-10 { z-index: 10; }
      .overflow-hidden { overflow: hidden; }
      .resize-y { resize: vertical; }
      .cursor-grab { cursor: grab; }
      .cursor-pointer { cursor: pointer; }
      .relative { position: relative; }
      .absolute { position: absolute; }
      .hidden { display: none; }
      .max-w-2xl { max-width: 42rem; }
      .max-w-4xl { max-width: 56rem; }
      .mx-auto { margin-left: auto; margin-right: auto; }
      .min-w-\[70px\] { min-width: 70px; }
      .flex-1 { flex: 1 1 0%; }
      .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
      .transition-colors { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
      .transition-opacity { transition-property: opacity; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
      .duration-200 { transition-duration: 200ms; }
      .duration-300 { transition-duration: 300ms; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0; }
      .placeholder-gray-500::placeholder { color: #6b7280; }
      @media (min-width: 768px) {
        .md\:w-1\/2 { width: 50%; }
        .md\:w-64 { width: 16rem; }
      }
      .control-input {
        background-color: #1a1a1a;
        color: white;
        border: 2px solid transparent;
        border-radius: 0.375rem;
        padding: 0.75rem;
        width: 100%;
      }
      .control-input:focus {
        outline: none;
        border-color: #3b82f6;
      }
      .action-button {
        border-radius: 0.375rem;
        font-weight: 700;
        padding: 0.75rem 1.5rem;
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
      }
      .action-button::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 300%;
        height: 300%;
        background: rgba(255, 255, 255, 0.1);
        transition: all 0.5s ease-in-out;
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(0);
        z-index: 0;
      }
      .action-button:hover::before {
        transform: translate(-50%, -50%) scale(1);
      }
      .action-button:hover {
        background-color: #1f2937;
      }
      .action-button.bg-green-600:hover {
        background-color: #15803d;
      }
      .action-button span {
        position: relative;
        z-index: 1;
      }
      #previewCanvas {
        image-rendering: pixelated;
      }
      #fontSelect {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%23E0E0E0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
        background-repeat: no-repeat;
        background-position: right 10px center;
        padding-right: 2.5rem;
      }
      .alignment-button {
        padding: 0.75rem;
        border-radius: 9999px;
        transition: colors 0.2s;
        background-color: transparent;
        color: #9ca3af;
      }
      .alignment-button.active {
        background-color: #3b82f6;
        color: white;
      }
      .alignment-button:hover {
        background-color: #4b5563;
        color: white;
      }
      .flash-green {
        animation: flash-green 0.5s ease-in-out forwards;
      }
      .flash-red {
        animation: flash-red 0.5s ease-in-out forwards;
      }
      @keyframes flash-green {
        0% { color: #4b5563; }
        50% { color: #22c55e; }
        100% { color: #4b5563; }
      }
      @keyframes flash-red {
        0% { color: #4b5563; }
        50% { color: #ef4444; }
        100% { color: #4b5563; }
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: #374151;
        height: 0.5rem;
        border-radius: 0.5rem;
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 1rem;
        height: 1rem;
        background: #3b82f6;
        cursor: pointer;
        border-radius: 50%;
      }
      input[type="range"]::-moz-range-thumb {
        width: 1rem;
        height: 1rem;
        background: #3b82f6;
        cursor: pointer;
        border-radius: 50%;
        border: none;
      }
    </style>
  </head>
  <body>
    <!-- Control Panel at the top -->
    <div class="flex-shrink-0 bg-[#242424] p-8 shadow-lg w-full z-10">
      <div class="max-w-4xl mx-auto flex flex-col items-center gap-6">
        <h1 class="text-3xl font-bold mb-6 text-center">
          Pixel Font Generator
        </h1>

        <!-- Text Input -->
        <div class="w-full text-center max-w-2xl mx-auto">
          <label for="textInput" class="control-label sr-only"
            >Text Input:</label
          >
          <textarea
            id="textInput"
            rows="3"
            class="control-input resize-y placeholder-gray-500"
            placeholder="Enter your text here"
          ></textarea>
        </div>

        <!-- Font Selection -->
        <div class="w-full md:w-1/2 flex items-center justify-center gap-2">
          <button
            id="prevFontBtn"
            class="action-button bg-gray-700 hover:bg-gray-800 text-white w-12 h-12 flex items-center justify-center text-xl p-0 transition-all duration-200"
          >
            <span>&lt;</span>
          </button>
          <select id="fontSelect" class="control-input flex-grow text-center">
            <!-- Options will be populated by JavaScript -->
          </select>
          <button
            id="nextFontBtn"
            class="action-button bg-gray-700 hover:bg-gray-800 text-white w-12 h-12 flex items-center justify-center text-xl p-0 transition-all duration-200"
          >
            <span>&gt;</span>
          </button>
        </div>

        <!-- Font Height Controls (for web fonts) -->
        <div
          id="fontHeightControls"
          class="w-full md:w-1/2 flex items-center justify-center gap-2"
        >
          <button
            id="decreaseSize"
            class="action-button bg-gray-700 hover:bg-gray-800 text-white w-12 h-12 flex items-center justify-center text-2xl p-0 transition-all duration-200"
          >
            -
          </button>
          <span
            id="fontHeightDisplay"
            class="text-xl font-bold text-center w-20"
            >16</span
          >
          <button
            id="increaseSize"
            class="action-button bg-gray-700 hover:bg-gray-800 text-white w-12 h-12 flex items-center justify-center text-2xl p-0 transition-all duration-200"
          >
            +
          </button>
        </div>

        <!-- Font Scale Controls (for custom fonts) -->
        <div
          id="fontScaleControls"
          class="w-full md:w-1/2 flex items-center justify-center gap-2 hidden"
        >
          <label class="text-lg font-semibold text-gray-400 min-w-[70px]"
            >Scale:</label
          >
          <input
            type="range"
            id="fontScaleRange"
            min="1"
            max="16"
            value="1"
            class="flex-1 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"
          />
          <span id="fontScaleDisplay" class="text-xl font-bold text-center w-8"
            >1</span
          >
        </div>

        <!-- Alignment Controls -->
        <div
          id="alignmentControls"
          class="flex items-center justify-center bg-gray-700 rounded-full overflow-hidden p-1 shadow-inner"
        >
          <button
            id="align-left"
            class="alignment-button active p-3 rounded-full transition-colors duration-200"
            title="Align Left"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="15" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <button
            id="align-center"
            class="alignment-button p-3 rounded-full transition-colors duration-200"
            title="Align Center"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="21" y1="6" x2="3" y2="6"></line>
              <line x1="18" y1="12" x2="6" y2="12"></line>
              <line x1="21" y1="18" x2="3" y2="18"></line>
            </svg>
          </button>
          <button
            id="align-right"
            class="alignment-button p-3 rounded-full transition-colors duration-200"
            title="Align Right"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="21" y1="6" x2="3" y2="6"></line>
              <line x1="21" y1="12" x2="9" y2="12"></line>
              <line x1="21" y1="18" x2="3" y2="18"></line>
            </svg>
          </button>
          <button
            id="align-justify"
            class="alignment-button p-3 rounded-full transition-colors duration-200"
            title="Justify"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Download Button -->
        <div class="mt-8 flex justify-center">
          <button
            id="downloadBtn"
            class="action-button bg-green-600 hover:bg-green-700 text-white w-full md:w-64 py-4 text-xl rounded-full"
          >
            <span>Generate & Save PNG</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Preview Area below -->
    <div
      id="previewContainer"
      class="relative flex-grow bg-white cursor-grab overflow-hidden flex items-center justify-center"
    >
      <canvas id="previewCanvas"></canvas>
      <div
        id="hintText"
        class="absolute bottom-10 left-1/2 -translate-x-1/2 text-gray-500 text-base opacity-100 transition-opacity duration-300 pointer-events-none"
      >
        Use mouse wheel to zoom. Click and drag to pan.
      </div>
      <div
        id="pixelCount"
        class="absolute bottom-4 left-1/2 -translate-x-1/2 text-xl text-gray-500 font-semibold"
      >
        Pixel Count: 0
      </div>
    </div>

    <script src="fonts_data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
